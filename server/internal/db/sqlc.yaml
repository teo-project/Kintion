# Генерация: docker compose -f deploy/compose.dev.yml run --rm tools sqlc generate -f server/internal/db/sqlc.yaml
# Проверка, что закоммиченный код совпадает (CI): ... tools sqlc diff -f server/internal/db/sqlc.yaml
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: sqlc
        out: sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: partial_date
            go_type: kintion/server/internal/partialdate.Date
          - db_type: partial_date
            nullable: true
            go_type:
              import: kintion/server/internal/partialdate
              type: Date
              pointer: true
