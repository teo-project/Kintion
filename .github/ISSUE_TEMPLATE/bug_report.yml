name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please do not report them here, see SECURITY.md. Do not paste real personal data; describe it with made-up people.
  - type: input
    id: version
    attributes:
      label: Version
      description: Account → About, or the image tag
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a person card
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, how Kintion is deployed (Compose, Dockge, Portainer), language, relevant log lines (docker compose logs app)
