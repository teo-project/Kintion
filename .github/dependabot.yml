# Weekly dependency updates, grouped per ecosystem to keep the number of pull requests low.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups: { e2e: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
