# Checks on every push and pull request: Go (vet, lint, tests against
# PostgreSQL, generated sqlc code), web (types, lint, unit tests, build) and the
# end-to-end test on a fresh Compose install.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  pull_request:
  # the release workflow runs the same checks before building the image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kintion
          POSTGRES_PASSWORD: kintion
          POSTGRES_DB: kintion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kintion -d kintion"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEO_KIN_TEST_DATABASE_URL: postgres://kintion:kintion@localhost:5432/kintion?sslmode=disable
      TEO_KIN_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generated sqlc code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff -f server/internal/db/sqlc.yaml
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: go test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compose install + Playwright
        # keep the install so the next step can print its log
        env:
          KIN_E2E_KEEP: "1"
        run: bash e2e/run.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml -f deploy/compose.e2e.yml logs app
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: e2e/test-results/
          retention-days: 7

  image-build:
    # Проверяем обе архитектуры до релиза, без записи в GHCR.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=check-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
