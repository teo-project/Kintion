# CLA check on pull requests: the author signs once by posting the sentence the
# bot asks for; signatures are stored in this repository, file
# signatures/version1/cla.json in the unprotected branch cla-signatures (create the
# branch once; the bot creates the file). The check "CLA" is required for merging into
# main (branch protection).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLA:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # pull_request_target runs with write access: this job never checks out or
      # runs code from the pull request.
      - uses: contributor-license/cla-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # re-runs the failed PR check after a signature comment (issue_comment
          # results do not count as the PR's required check)
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
