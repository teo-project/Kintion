# Release image: on a version tag v*, build deploy/Dockerfile for amd64 and
# arm64 and push it to ghcr.io/<owner>/kintion with the tags <version> and latest
# (latest only for releases without a suffix such as -rc.1). The Dockerfile
# cross-compiles, so no emulation is needed.
name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # the image is published only if the tagged commit passes all checks
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kintion" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{raw}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Kintion
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
